<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071527"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6b11ff"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #a0aec0; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #00f2fe; }
    
    /* Dynamic Radar Pulse Animation */
    @keyframes pulse {
      0% { r: 40px; opacity: 0.8; stroke-width: 2px; }
      50% { r: 110px; opacity: 0.3; stroke-width: 1.5px; }
      100% { r: 180px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes scan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .pulse-circle { animation: pulse 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; transform-origin: 1020px 200px; }
    .pulse-circle-2 { animation: pulse 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; animation-delay: 2s; transform-origin: 1020px 200px; }
    .radar-sweep { animation: scan 8s linear infinite; transform-origin: 1020px 200px; }
    .floating-icon { animation: float 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Cyber Grid Lines Background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Background Radar / Dynamic Visuals (Positioned on the right to not obscure text) -->
  <g>
    <circle cx="1020" cy="200" r="140" fill="none" stroke="#4facfe" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="1020" cy="200" r="90" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="1020" cy="200" r="40" fill="none" stroke="#6b11ff" stroke-opacity="0.4" stroke-width="1.5"/>

    <circle class="pulse-circle" cx="1020" cy="200" r="40" fill="none" stroke="#00f2fe"/>
    <circle class="pulse-circle-2" cx="1020" cy="200" r="40" fill="none" stroke="#4facfe"/>

    <!-- Radar Sweep Line -->
    <g class="radar-sweep">
      <path d="M 1020 200 L 1160 200 A 140 140 0 0 0 1020 60 Z" fill="url(#accentGrad)" fill-opacity="0.15"/>
      <line x1="1020" y1="200" x2="1160" y2="200" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)"/>

  <!-- Left Content (Foreground Text & Badges - Safe from overlapping) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Tag -->
    <g transform="translate(0, 85)">
      <rect width="280" height="34" rx="17" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
      <text x="140" y="22" text-anchor="middle" class="badge-text">🛡️ CYBERSECURITY &amp; EDR HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="175" class="title">
      Awesome Endpoint Detection
    </text>
    <text x="0" y="230" class="title" fill="url(#accentGrad)">
      &amp; Response (EDR)
    </text>

    <!-- Subtitle -->
    <text x="0" y="282" class="subtitle">
      Curated SaaS Platforms, Open-Source Repos &amp; Threat Detection Tools
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="75" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">☁️ SaaS Solutions</text>

      <!-- Pill 2 -->
      <rect x="162" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="244" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🔓 Open-Source EDR</text>

      <!-- Pill 3 -->
      <rect x="339" y="0" width="175" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="426" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🎯 Threat Hunting &amp; IR</text>
    </g>

  </g>

  <!-- Right Floating Shield Icon -->
  <g class="floating-icon" transform="translate(1020, 200)">
    <path d="M 0 -35 L 25 -20 L 25 10 C 25 28 0 40 0 40 C 0 40 -25 28 -25 10 L -25 -20 Z" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#00f2fe"/>
  </g>
</svg>
